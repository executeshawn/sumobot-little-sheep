; ============================================================================
;  Sumobot "Heatseeker" - ESP32-S3 N16R8 (16MB flash / 8MB octal PSRAM)
; ============================================================================
;
;  Architecture
;    Each firmware image is its own PlatformIO env. There is NO `pio test`
;    usage and NO Unity framework: the bring-up sketches under test/ are
;    plain Arduino sketches (setup()/loop()) and are built as ordinary
;    firmware via `pio run -e <name>`.
;
;    Shared modules (motors, movement, sensors, strategy, pins, config)
;    live in lib/Sumobot/ and are auto-discovered as a PlatformIO library
;    by every env via the LDF. Each env scopes its sources with
;    build_src_filter so exactly ONE setup()/loop() ends up in the build.
;
;  Layout
;    src/                              <- production firmware entry only
;      main.cpp
;    lib/Sumobot/                      <- shared modules (LDF-discovered)
;      motors.{cpp,h}   movement.{cpp,h}
;      sensors_tof.{cpp,h}   sensors_edge.{cpp,h}
;      strategy.{cpp,h}   pins.h   config.h
;      library.json
;    test/<name>/test_main.cpp         <- one bring-up firmware per dir
;
;  Building / flashing
;    Production:    pio run -e esp32s3 -t upload
;    Bring-up:      pio run -e test_motor_diag           -t upload
;                   pio run -e test_motor                -t upload
;                   pio run -e test_calibration_protocol -t upload
;                   pio run -e test_full_system          -t upload
;                   pio run -e test_qtr                  -t upload
;                   pio run -e test_vl53                 -t upload
;                   pio run -e test_vl53_bringup         -t upload
;                   pio run -e test_vl53_verify          -t upload
;                   pio run -e test_button               -t upload
;                   pio run -e test_fsm                  -t upload
;    Monitor:       pio device monitor -e <env-name>
;
;  Platform pin
;    espressif32 @ ^6.x ships Arduino-ESP32 core 2.0.x, which exposes the
;    classic ledcSetup()/ledcAttachPin() LEDC API used by motors.cpp.
;    Core 3.x replaced this with ledcAttach(); if the platform is bumped,
;    update lib/Sumobot/motors.cpp accordingly.
;
;  Why not src_dir per env: src_dir is a [platformio]-section option, not
;  an env option. Per-env source scoping is done via build_src_filter,
;  whose paths are relative to src_dir (which stays at the default src/).

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
;  Shared env defaults. Every concrete env below inherits these via the
;  bare [env] section.
; ---------------------------------------------------------------------------
[env]
platform        = espressif32@^6.7.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200

; ---- Flash / PSRAM for the N16R8 module (octal PSRAM) ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; Sumobot shared modules live in lib/Sumobot/ and are picked up by the
; PlatformIO Library Dependency Finder. The Pololu drivers are listed in
; lib/Sumobot/library.json; declaring them here too lets the LDF resolve
; them deterministically on a clean checkout.
lib_deps =
    pololu/VL53L0X@^1.3.1
    pololu/QTRSensors@^4.0.0

; ---------------------------------------------------------------------------
;  PRODUCTION FIRMWARE
;    src/main.cpp is the only source under src/. Default build_src_filter
;    (+<*>) picks it up; nothing to exclude.
; ---------------------------------------------------------------------------
[env:esp32s3]

; ---------------------------------------------------------------------------
;  HARDWARE BRING-UP FIRMWARES
;
;    Each env:
;      - excludes src/main.cpp so the production entry is NOT linked.
;      - includes exactly one test/<name>/test_main.cpp.
;    build_src_filter paths are relative to src_dir (= src/), so
;    `../test/<name>/test_main.cpp` reaches up one level into test/.
;    Adding a new sketch is a 4-line copy of any block below.
; ---------------------------------------------------------------------------

[env:test_motor_diag]
build_src_filter =
    -<main.cpp>
    +<../test/test_motor_diag/test_main.cpp>

[env:test_motor]
build_src_filter =
    -<main.cpp>
    +<../test/test_motor/test_main.cpp>

[env:test_calibration_protocol]
build_src_filter =
    -<main.cpp>
    +<../test/test_calibration_protocol/test_main.cpp>

[env:test_full_system]
build_src_filter =
    -<main.cpp>
    +<../test/test_full_system/test_main.cpp>

[env:test_qtr]
build_src_filter =
    -<main.cpp>
    +<../test/test_qtr/test_main.cpp>

[env:test_vl53]
build_src_filter =
    -<main.cpp>
    +<../test/test_vl53/test_main.cpp>

[env:test_vl53_bringup]
build_src_filter =
    -<main.cpp>
    +<../test/test_vl53_bringup/test_main.cpp>

[env:test_vl53_verify]
build_src_filter =
    -<main.cpp>
    +<../test/test_vl53_verify/test_main.cpp>

[env:test_button]
build_src_filter =
    -<main.cpp>
    +<../test/test_button/test_main.cpp>

[env:test_fsm]
build_src_filter =
    -<main.cpp>
    +<../test/test_fsm/test_main.cpp>
