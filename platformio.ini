; ============================================================================
;  Sumobot "Heatseeker" - ESP32-S3 N16R8 (16MB flash / 8MB octal PSRAM)
; ============================================================================
;
;  NOTE on platform pin:
;    espressif32 @ ^6.x ships Arduino-ESP32 core 2.0.x, which uses the classic
;    ledcSetup()/ledcAttachPin() LEDC API used by src/motors.cpp. Core 3.x
;    replaced this with ledcAttach(); if you upgrade the platform, update
;    motors.cpp accordingly.
;
;  Motor driver:
;    The TB6612FNG is driven directly from src/motors.cpp using ESP32 LEDC
;    PWM and digitalWrite() for the direction pins. No external motor library
;    is required.
;
[env:esp32s3]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ---- Flash / PSRAM for the N16R8 module (octal PSRAM) ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; ---- Library dependencies (exact registry package names) ----
lib_deps =
    pololu/VL53L0X@^1.3.1
    pololu/QTRSensors@^4.0.0

; ---- Hardware bring-up tests ----
;  Each test/test_*/test_main.cpp is a plain Arduino setup()/loop() sketch.
;  `pio test -f test_xxx` is used only as a build/upload selector.
;  test_build_src = true pulls src/* into the test build; PlatformIO
;  automatically excludes src/main.cpp so the test's setup()/loop() runs.
build_src_filter = +<*> -<main.cpp>
test_build_src = true
